<!doctype html>
<html lang="en" data-bs-theme="dark">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Hard Metrics{% endblock %} · Hard Metrics</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
{% block head %}{% endblock %}
<style>
:root{--bg1:#0b1020;--bg2:#2a1a6b;--glass:rgba(255,255,255,.06);--bd:rgba(255,255,255,.14);--tx:#e8ecff;--mut:#98a2c7;--g1:#7c5cff;--g2:#22d3ee;--ok:#34d399;--warn:#fbbf24;--bad:#f87171}
[data-bs-theme=light]{--bg1:#eef2ff;--bg2:#c7d7ff;--glass:rgba(255,255,255,.7);--bd:rgba(80,90,160,.22);--tx:#1b2142;--mut:#5b6491}
body{min-height:100vh;color:var(--tx);background:radial-gradient(1100px 600px at 8% -10%,var(--bg2),transparent),var(--bg1) fixed}
.text-mut{color:var(--mut)!important}a{color:var(--g2)}
.glass{position:relative;background:var(--glass);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--bd);border-radius:18px;padding:1.1rem;box-shadow:0 8px 32px rgba(0,0,0,.22)}
.glass::before{content:"";position:absolute;inset:-1px;border-radius:18px;padding:1px;pointer-events:none;opacity:.75;background:linear-gradient(135deg,var(--g1),transparent 42%,var(--g2));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
.glass h6{font-weight:600;margin-bottom:.8rem}
.table{--bs-table-bg:transparent;--bs-table-color:var(--tx);--bs-table-border-color:var(--bd);margin:0;font-size:.85rem}
.scroll{max-height:420px;overflow:auto}
.dot{width:10px;height:10px;border-radius:50%;background:var(--mut);display:inline-block}
.dot.ok{background:var(--ok);box-shadow:0 0 10px var(--ok)}.dot.bad{background:var(--bad);box-shadow:0 0 10px var(--bad)}
.item{cursor:pointer;padding:.55rem .7rem;border-radius:10px;border:1px solid transparent}.item:hover,.item.on{border-color:var(--bd);background:rgba(128,128,170,.12)}
pre.code{background:#05070f;color:#cfe8ff;padding:1rem;border-radius:12px;font-size:.78rem;max-height:65vh;overflow:auto;margin:0;white-space:pre-wrap;word-break:break-word}
.chartbox{position:relative;height:220px}
.big{font-size:1.6rem;font-weight:700;line-height:1.1}
</style></head>
<body><div class="container-xxl py-3">
<div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
  <h3 class="mb-0"><i class="bi bi-activity me-2"></i>Hard Metrics</h3>
  <div class="d-flex gap-2">
    <button id="theme" class="btn btn-sm btn-outline-secondary" title="Switch theme"><i class="bi bi-moon-stars"></i></button>
    <form method="post" action="{% url 'logout' %}" class="m-0">{% csrf_token %}<button class="btn btn-sm btn-outline-secondary">Sign out</button></form>
  </div>
</div>
{% include "hard_metrics/_nav.html" %}
{% block content %}{% endblock %}
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
const CSRF = "{{ csrf_token }}";
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const hum = n => { const u=["B","KB","MB","GB","TB"]; let i=0; n=+n||0; while(n>=1024&&i<4){n/=1024;i++} return n.toFixed(i?1:0)+" "+u[i]; };
const badge = (ok, t) => `<span class="badge text-bg-${ok===null?"secondary":ok?"success":"danger"}">${esc(t)}</span>`;
async function api(url, opts){ const r = await fetch(url, {credentials:"same-origin", ...opts}); let j=null; try{ j = await r.json(); }catch(e){} if(!j) throw new Error(r.status===403 ? "Staff access required" : "Request failed ("+r.status+")"); return j; }
const post = (url, data) => api(url, {method:"POST", headers:{"X-CSRFToken":CSRF,"Content-Type":"application/x-www-form-urlencoded"}, body:new URLSearchParams(data)});
function setTheme(t){ document.documentElement.setAttribute("data-bs-theme", t); localStorage.setItem("hm-theme", t);
  $("theme").innerHTML = t==="dark" ? '<i class="bi bi-moon-stars"></i>' : '<i class="bi bi-sun"></i>'; if(window.onTheme) window.onTheme(); }
$("theme").onclick = () => setTheme(document.documentElement.getAttribute("data-bs-theme")==="dark" ? "light" : "dark");
setTheme(localStorage.getItem("hm-theme") || "dark");
</script>
{% block script %}{% endblock %}
</body></html>
