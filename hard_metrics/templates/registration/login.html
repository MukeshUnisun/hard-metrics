<!doctype html>
<html lang="en" data-bs-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · Hard Metrics</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>body{min-height:100vh;display:grid;place-items:center;background:radial-gradient(900px 500px at 15% 0,#2a1a6b,transparent),#0b1020;color:#e8ecff}
.box{width:min(380px,92vw);padding:2rem;border-radius:20px;background:rgba(255,255,255,.06);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.16);box-shadow:0 0 40px rgba(124,92,255,.25)}</style></head>
<body><form method="post" class="box">{% csrf_token %}
<h4 class="mb-1">Hard Metrics</h4><p class="text-secondary small mb-4">Sign in to view server health.</p>
{% if form.errors %}<div class="alert alert-danger py-2 small">Username or password is wrong.</div>{% endif %}
<input class="form-control mb-3" name="username" placeholder="Username" autofocus required>
<input class="form-control mb-3" type="password" name="password" placeholder="Password" required>
<input type="hidden" name="next" value="{{ next }}">
<button class="btn btn-primary w-100">Sign in</button></form></body></html>
